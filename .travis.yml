os: linux
dist: jammy
language: java
python:
- '3.10'
jdk:
- openjdk21
cache:
  directories:
    - '$HOME/.cache/pip'
    - '$HOME/.sonar/cache'
branches:
  only:
  - main
  - /^v\d+\.\d+(\.\d+)?(-\S*)?$/
before_install:
- pip install -U pip
install:
- pip install -e '.[test]'
script:
- coverage run -m pytest --junitxml=results.xml
- coverage xml
- mypy --ignore-missing-imports src/ tests/
- flake8 src/ tests/
deploy:
  - provider: releases
    token:
      secure: 
    file: "bogus.file"
    prerelease: true
    on:
      tags: true
    edge: true # opt in to dpl v2